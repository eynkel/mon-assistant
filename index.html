<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .msg-user {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border-radius: 18px 18px 4px 18px;
        }
        .msg-assistant {
            background: linear-gradient(135deg, #1e3a5f 0%, #1e40af 100%);
            border-radius: 18px 18px 18px 4px;
        }

        .glow {
            box-shadow: 0 0 60px rgba(59, 130, 246, 0.1);
        }

        .typing::after {
            content: '▍';
            animation: blink 0.8s infinite;
            color: #60a5fa;
        }
        @keyframes blink { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .drop-active {
            border: 2px dashed #3b82f6 !important;
            background: rgba(59, 130, 246, 0.08) !important;
        }

        .copy-btn {
            opacity: 0;
            transition: opacity 0.2s;
        }
        .group:hover .copy-btn { opacity: 1; }

        pre { position: relative; }
        pre code { font-family: 'Fira Code', 'Consolas', monospace; }

        html, body { overflow-x: hidden; }

        #message { min-height: 48px; max-height: 200px; }

        .thread-item {
            transition: all 0.15s ease;
        }
        .thread-item:hover { background: rgba(255,255,255,0.05); }
        .thread-item.active { background: rgba(59, 130, 246, 0.15); border-left: 3px solid #3b82f6; }

        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">
    <aside id="sidebar" class="w-64 bg-slate-900 border-r border-slate-700 flex flex-col flex-shrink-0">
        <div class="p-4 border-b border-slate-700">
            <h1 class="text-lg font-bold text-blue-400 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                Assistant IA
            </h1>
        </div>
        <div class="p-3">
            <button onclick="newThread()" class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white px-4 py-2.5 rounded-xl flex items-center justify-center gap-2 transition font-medium shadow-lg shadow-blue-600/20">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                Nouveau thread
            </button>
        </div>
        <div id="threads" class="flex-1 overflow-y-auto px-2 py-1 space-y-1"></div>
        <div class="p-3 border-t border-slate-700 text-xs text-slate-500 text-center">
            💾 Sauvegardé localement
        </div>
    </aside>

    <main class="flex-1 flex flex-col glow min-w-0">
        <div id="chat" class="flex-1 overflow-y-auto p-6 space-y-6"></div>

        <div id="filePreview" class="hidden px-6 py-3 bg-slate-800/70 backdrop-blur border-y border-slate-700 flex items-center gap-3">
            <span class="text-sm text-slate-300">📄 <span id="fileName"></span></span>
            <span id="fileSize" class="text-xs text-slate-500"></span>
            <button onclick="removeFile()" class="ml-auto text-slate-400 hover:text-red-400 transition p-1">✕</button>
        </div>

        <div class="p-4 bg-slate-900/90 backdrop-blur border-t border-slate-700">
            <div id="dropZone" class="max-w-4xl mx-auto flex gap-3 items-end">
                <label class="p-3 bg-slate-800 hover:bg-slate-700 rounded-xl cursor-pointer transition flex-shrink-0" title="Joindre un fichier">
                    <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>
                    <input type="file" id="fileInput" class="hidden" accept=".pdf,.txt,.doc,.docx,.md,.csv,.json,.py,.js,.html,.css,.png,.jpg,.jpeg,.gif,.svg,.xml,.yaml,.yml,.sh,.bash,.ts,.tsx,.java,.c,.cpp,.h,.hpp">
                </label>
                <textarea id="message" rows="1" placeholder="Écrire un message..." class="flex-1 bg-slate-800 text-white px-4 py-3 rounded-xl border border-slate-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition resize-none overflow-y-auto"></textarea>
                <button onclick="sendMessage()" id="sendBtn" class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 px-6 py-3 rounded-xl transition font-medium shadow-lg shadow-blue-600/20 send-btn">Envoyer</button>
            </div>
        </div>
    </main>

    <script>
        let threads = JSON.parse(localStorage.getItem('chat_threads') || '{}');
        let currentId = localStorage.getItem('current_thread') || null;
        let attachedFile = null;

        if (!currentId || !threads[currentId]) {
            currentId = 't_' + Date.now();
            threads[currentId] = { id: currentId, name: 'Nouvelle conversation', messages: [], createdAt: Date.now() };
        }

        function save() {
            localStorage.setItem('chat_threads', JSON.stringify(threads));
            localStorage.setItem('current_thread', currentId);
        }

        function renderThreads() {
            const el = document.getElementById('threads');
            el.innerHTML = '';
            const sorted = Object.values(threads).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            sorted.forEach(t => {
                const div = document.createElement('div');
                div.className = `thread-item px-3 py-2 rounded-lg cursor-pointer text-sm text-slate-300 ${t.id === currentId ? 'active' : ''}`;
                div.innerHTML = `<div class="flex items-center gap-2"><span class="truncate flex-1">${escapeHtml(t.name)}</span><span class="text-xs text-slate-600">${t.messages.length}</span></div>`;
                div.onclick = () => switchThread(t.id);
                el.appendChild(div);
            });
        }

        function switchThread(id) {
            currentId = id;
            save();
            renderThreads();
            renderMessages();
        }

        function newThread() {
            currentId = 't_' + Date.now();
            threads[currentId] = { id: currentId, name: 'Nouvelle conversation', messages: [], createdAt: Date.now() };
            save();
            renderThreads();
            renderMessages();
            document.getElementById('message').focus();
        }

        function deleteThread(id) {
            delete threads[id];
            if (Object.keys(threads).length === 0) {
                newThread();
            } else if (id === currentId) {
                const keys = Object.keys(threads);
                currentId = keys[keys.length - 1];
            }
            save();
            renderThreads();
            renderMessages();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderMessages() {
            const chat = document.getElementById('chat');
            chat.innerHTML = '';
            const thread = threads[currentId];
            if (!thread) return;

            if (thread.messages.length === 0) {
                chat.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-slate-500">
                        <div class="w-20 h-20 rounded-full bg-slate-800/50 flex items-center justify-center mb-6">
                            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                        </div>
                        <p class="text-lg font-medium text-slate-400 mb-1">Commencez une conversation</p>
                        <p class="text-sm">Envoyez un message pour commencer</p>
                    </div>`;
                return;
            }

            thread.messages.forEach((msg, i) => {
                const isUser = msg.role === 'user';
                const div = document.createElement('div');
                div.className = `fade-in flex ${isUser ? 'justify-end' : 'justify-start'}`;

                const bubble = document.createElement('div');
                bubble.className = `${isUser ? 'msg-user' : 'msg-assistant'} group px-5 py-3 max-w-[75%] ${isUser ? 'text-right' : ''}`;
                bubble.style = 'word-break: break-word; overflow-wrap: break-word;';

                if (msg.file) {
                    const fileInfo = document.createElement('div');
                    fileInfo.className = 'text-xs text-slate-400 mb-2 flex items-center gap-1';
                    fileInfo.innerHTML = `📎 ${escapeHtml(msg.file.name)}`;
                    bubble.appendChild(fileInfo);
                }

                if (isUser) {
                    bubble.textContent = msg.content;
                } else {
                    bubble.innerHTML = renderMarkdown(msg.content);
                    bubble.querySelectorAll('pre').forEach(pre => {
                        const wrapper = document.createElement('div');
                        wrapper.style = 'position: relative;';
                        const btn = document.createElement('button');
                        btn.className = 'copy-btn absolute top-2 right-2 bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs px-2 py-1 rounded transition';
                        btn.textContent = 'Copier';
                        btn.onclick = () => {
                            navigator.clipboard.writeText(pre.textContent);
                            btn.textContent = '✓ Copié';
                            setTimeout(() => btn.textContent = 'Copier', 2000);
                        };
                        pre.style = 'background: rgba(0,0,0,0.3); padding: 1rem; border-radius: 8px; overflow-x: auto;';
                        pre.parentNode.insertBefore(wrapper, pre);
                        wrapper.appendChild(btn);
                        wrapper.appendChild(pre);
                    });
                }

                const time = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '';
                const timeEl = document.createElement('div');
                timeEl.className = 'text-xs text-slate-500 mt-1 ' + (isUser ? 'text-right' : 'text-left');
                timeEl.textContent = time;
                bubble.appendChild(timeEl);

                div.appendChild(bubble);
                chat.appendChild(div);
            });

            chat.scrollTop = chat.scrollHeight;
        }

        function renderMarkdown(text) {
            if (typeof marked !== 'undefined') {
                marked.setOptions({ breaks: true, gfm: true });
                return marked.parse(text);
            }
            return escapeHtml(text).replace(/\n/g, '<br>');
        }

        function showTyping() {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'flex justify-start fade-in';
            div.id = 'typingIndicator';
            div.innerHTML = `<div class="msg-assistant px-5 py-3"><span class="typing text-slate-300">En train d'écrire</span></div>`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        async function sendMessage() {
            const input = document.getElementById('message');
            const content = input.value.trim();
            if (!content && !attachedFile) return;

            const thread = threads[currentId];
            const userMsg = { role: 'user', content, timestamp: Date.now() };
            if (attachedFile) userMsg.file = attachedFile;
            thread.messages.push(userMsg);

            if (thread.messages.length === 1) {
                thread.name = content.substring(0, 40) + (content.length > 40 ? '...' : '');
            }

            save();
            renderThreads();
            renderMessages();

            input.value = '';
            input.style.height = 'auto';
            removeFile();

            showTyping();

            const msgs = thread.messages.map(m => ({ role: m.role, content: m.content }));
            if (attachedFile) {
                const reader = new FileReader();
                reader.onload = async () => {
                    const base64 = reader.result.split(',')[1];
                    msgs[msgs.length - 1].content += `\n\n[Fichier: ${attachedFile.name}]`;
                    await generateResponse(msgs);
                };
                reader.readAsDataURL(attachedFile);
            } else {
                await generateResponse(msgs);
            }
        }

        async function generateResponse(messages) {
            try {
                removeTyping();
                const chat = document.getElementById('chat');
                const div = document.createElement('div');
                div.className = 'flex justify-start fade-in';
                div.innerHTML = `<div class="msg-assistant px-5 py-3"><span class="typing text-slate-300">En train d'écrire</span></div>`;
                chat.appendChild(div);
                chat.scrollTop = chat.scrollHeight;

                await new Promise(r => setTimeout(r, 1500));

                removeTyping();

                const responses = [
                    "Je comprends votre demande. Laissez-moi vous fournir une réponse détaillée.\n\n## Analyse\n\n1. Premier point important\n2. Deuxième point\n3. Conclusion\n\n```javascript\n// Exemple de code\nconst example = 'hello';\nconsole.log(example);\n```",
                    "Bonjour ! Je suis prêt à vous aider. Pouvez-vous préciser votre question ?\n\n- Option 1\n- Option 2\n- Option 3",
                    "Voici ce que je propose :\n\n> Une citation interesante\n\nLorem ipsum dolor sit amet, consectetur adipiscing elit.",
                    "Parfait ! Voici la solution :\n\n| Colonne 1 | Colonne 2 |\n|-----------|-----------|\n| Donnée 1  | Donnée 2  |\n| Donnée 3  | Donnée 4  |"
                ];

                const response = responses[Math.floor(Math.random() * responses.length)];

                const thread = threads[currentId];
                thread.messages.push({ role: 'assistant', content: response, timestamp: Date.now() });
                save();
                renderMessages();

            } catch (err) {
                removeTyping();
                const thread = threads[currentId];
                thread.messages.push({ role: 'assistant', content: 'Erreur: ' + err.message, timestamp: Date.now() });
                save();
                renderMessages();
            }
        }

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            attachedFile = file;
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = formatFileSize(file.size);
            document.getElementById('filePreview').classList.remove('hidden');
        });

        function removeFile() {
            attachedFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('filePreview').classList.add('hidden');
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' o';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' Ko';
            return (bytes / (1024 * 1024)).toFixed(1) + ' Mo';
        }

        const textarea = document.getElementById('message');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        const dropZone = document.getElementById('dropZone');
        document.body.addEventListener('dragover', e => {
            e.preventDefault();
            dropZone.classList.add('drop-active');
        });
        document.body.addEventListener('dragleave', e => {
            if (!e.relatedTarget) dropZone.classList.remove('drop-active');
        });
        document.body.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('drop-active');
            const file = e.dataTransfer.files[0];
            if (file) {
                attachedFile = file;
                document.getElementById('fileName').textContent = file.name;
                document.getElementById('fileSize').textContent = formatFileSize(file.size);
                document.getElementById('filePreview').classList.remove('hidden');
            }
        });

        renderThreads();
        renderMessages();
    </script>
</body>
</html>
